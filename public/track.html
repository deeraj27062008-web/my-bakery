<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order — FreshBakes Bakery</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="Track Order">

<header id="site-header"></header>

<section class="hero-sm">
  <div class="container"><h1>📍 Track Your Order</h1><p>Enter your order ID to see the live status.</p></div>
</section>

<section class="section">
  <div class="container" style="max-width:720px;">
    <div class="flex" style="justify-content:center;">
      <input id="track-id" placeholder="e.g. FB2608161234" style="max-width:300px;" onkeydown="if(event.key==='Enter')track()">
      <button class="btn btn-dark" onclick="track()">Track</button>
    </div>

    <div id="result" class="mt-3"></div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script>
function track() {
  const id = document.getElementById('track-id').value.trim().toUpperCase();
  if (!id) { Store.toast('Enter your order ID', 'error'); return; }
  const order = Store.getOrder(id);
  const result = document.getElementById('result');
  if (!order) {
    result.innerHTML = `
      <div class="card centered">
        <div class="big">🔍</div>
        <h3>Order "${id}" not found</h3>
        <p class="muted">Double-check your order ID, or message us on WhatsApp for help.</p>
        <a class="btn btn-wa mt-2" href="https://wa.me/919618861300" target="_blank">Contact on WhatsApp</a>
      </div>`;
    return;
  }
  renderOrder(order);
}

function renderOrder(order) {
  const idx = Store.statusIndex(order.status);
  const result = document.getElementById('result');
  result.innerHTML = `
    <div class="card">
      <div class="flex between">
        <div>
          <h2 style="margin:0;">Order ${order.id}</h2>
          <span class="chip">${Store.fmtDate(order.createdAt)} • ${Store.fmtTime(order.createdAt)}</span>
        </div>
        <span class="pill ${order.status}">${order.status}</span>
      </div>

      <div class="grid mt-2" style="grid-template-columns:1fr 1fr;gap:10px;">
        <div><b>Name:</b> ${order.name}</div>
        <div><b>Phone:</b> ${order.phone}</div>
        <div><b>Delivery:</b> ${order.delivery}</div>
        <div><b>Payment:</b> ${order.payment}</div>
      </div>
      ${order.address ? `<div class="mt-1"><b>Address:</b> ${order.address}</div>` : ''}
      ${order.notes ? `<div class="mt-1"><b>Notes:</b> ${order.notes}</div>` : ''}

      <div class="summary mt-2">
        ${order.items.map(i => `<div class="line"><span>${i.qty} × ${i.name}</span><span>${Store.money(i.qty * i.price)}</span></div>`).join('')}
        ${order.subtotal ? `<div class="line"><span>Subtotal</span><span>${Store.money(order.subtotal)}</span></div>` : ''}
        ${order.deliveryFee > 0 ? `<div class="line"><span>Delivery</span><span>${Store.money(order.deliveryFee)}</span></div>` : (order.delivery === 'Delivery' && order.subtotal ? `<div class="line"><span>Delivery</span><span>FREE</span></div>` : '')}
        <div class="line total"><span>Total</span><span>${order.total > 0 ? Store.money(order.total) : 'TBD by store'}</span></div>
      </div>

      <h3 class="mt-3 mb-1">Status Timeline</h3>
      <div class="timeline">
        ${Store.STATUSES.map((s, i) => `
          <div class="tl-step ${i < idx ? 'done' : i === idx ? 'active' : ''}">
            <span class="tl-label">${s}</span>
            <div class="muted" style="font-size:.8rem;">${i < idx ? Store.fmtTime(order.history.find(h => h.status === s)?.at) : i === idx ? 'In progress…' : ''}</div>
          </div>`).join('')}
      </div>

      <div class="flex mt-3">
        <a class="btn btn-wa" href="https://wa.me/919618861300" target="_blank">💬 Ask on WhatsApp</a>
        <a class="btn btn-outline" style="border:2px solid var(--line);color:var(--brown);" href="menu.html">Order More</a>
      </div>
    </div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (id) {
    document.getElementById('track-id').value = id.toUpperCase();
    track();
  }
});
</script>
</body>
</html>
